# aweshare hub configuration (~/.aweshare-hub/config.toml)
# Generated by 'aweshare hub init'. Every key is commented out: uncomment one
# to override its default. Precedence: CLI flags (--host/--port) > environment
# variables (AWESHARE_*) > this file > defaults.

# Listen address.
#host = "0.0.0.0"
#port = 8787

# Per-consumer token bucket: refill per second, burst size, max in-flight.
#consumerRps = 10
#consumerBurst = 20
#consumerMaxConcurrent = 8

# Timeouts in ms: no response head within headTimeoutMs -> 504; no bytes
# within idleTimeoutMs after the head -> 504 (streaming keeps it alive).
#headTimeoutMs = 120000
#idleTimeoutMs = 300000

# Request body cap (32MB) and the unauthenticated invite-redeem rate limit.
#maxBodyBytes = 33554432
#inviteRedeemPerMinute = 10

# Cap on active (non-suspended) producers — the hub's tenant slots.
#maxProducers = 10
